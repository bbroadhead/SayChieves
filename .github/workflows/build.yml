name: Build SayChieves
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload ZIP to (e.g. v0.1.0)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Package Decky plugin
        run: |
          test -s dist/index.js
          node -e "const p=require('./plugin.json'); if(p.api_version!==1 || !p.name || !p.author) process.exit(1)"
          mkdir -p staging/SayChieves
          cp plugin.json package.json staging/SayChieves/
          cp -r dist staging/SayChieves/
          cd staging
          zip -r ../SayChieves.zip SayChieves
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayChieves
          path: SayChieves.zip
      - name: Publish or update release ZIP
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SayChieves.zip --clobber
          else
            gh release create "$TAG" SayChieves.zip --title "SayChieves $TAG" --generate-notes --prerelease
          fi
